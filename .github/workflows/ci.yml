name: ci
on: [push, pull_request]
env:
  MIX_ENV: test
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        otp: [28.x, 29.x]
        elixir: [1.17.x, 1.18.x, 1.19.x]
        include:
          - elixir: 1.16.x
            otp: 26.x
          - elixir: 1.17.x
            otp: 27.x
          - elixir: 1.18.x
            otp: 27.x
        exclude:
          - elixir: 1.19.x
            otp: 29.x
    steps:
      - uses: actions/checkout@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
        if: matrix.elixir == '1.19.x'
      - run: mix credo --strict
        if: matrix.elixir == '1.19.x' && matrix.otp == '29.x'
      - run: mix dialyzer
        if: matrix.elixir == '1.19.x' && matrix.otp == '29.x'
      - run: mix test
